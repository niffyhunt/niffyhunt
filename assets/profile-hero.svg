<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Systems atlas: how the WraithWall pipeline flows</title>
  <desc id="heroDesc">Illustration of a three-stage pipeline — collect, score, respond — ending at the live site wraithwall.online, with a row of extracted open-source packages below. Static illustration, not live data.</desc>
  <style>
    .hero-label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .pulse { animation: heroPulse 2.8s ease-in-out infinite; }
    @keyframes heroPulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: .85; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#161b22"/>
    </pattern>
  </defs>

  <!-- panel (self-contained dark surface: identical in light and dark mode) -->
  <rect x="0.5" y="0.5" width="899" height="299" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="898" height="298" rx="12" fill="url(#grid)"/>

  <!-- header -->
  <text class="hero-label" x="28" y="40" font-size="15" letter-spacing="4" fill="#8b949e">SYSTEMS ATLAS</text>
  <circle class="pulse" cx="726" cy="34" r="5" fill="#ff3b30"/>
  <text class="hero-label" x="742" y="40" font-size="15" fill="#ff6b6b">wraithwall.online</text>

  <!-- strata cards with depth shadows -->
  <g>
    <rect x="36" y="112" width="200" height="84" rx="8" fill="#010409"/>
    <rect x="32" y="108" width="200" height="84" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="32" y="108" width="4" height="84" rx="2" fill="#cc8400"/>
    <text class="hero-label" x="132" y="157" font-size="26" letter-spacing="2" text-anchor="middle" fill="#e6edf3">COLLECT</text>
    <text class="hero-label" x="132" y="180" font-size="13" text-anchor="middle" fill="#8b949e">honeypots · decoys · RIS</text>
  </g>
  <line x1="236" y1="150" x2="322" y2="150" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="334" y="112" width="200" height="84" rx="8" fill="#010409"/>
    <rect x="330" y="108" width="200" height="84" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="330" y="108" width="4" height="84" rx="2" fill="#cc8400"/>
    <text class="hero-label" x="430" y="157" font-size="26" letter-spacing="2" text-anchor="middle" fill="#e6edf3">SCORE</text>
    <text class="hero-label" x="430" y="180" font-size="13" text-anchor="middle" fill="#8b949e">ATT&amp;CK · campaigns</text>
  </g>
  <line x1="534" y1="150" x2="620" y2="150" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="632" y="112" width="200" height="84" rx="8" fill="#010409"/>
    <rect x="628" y="108" width="200" height="84" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="628" y="108" width="4" height="84" rx="2" fill="#cc0000"/>
    <text class="hero-label" x="728" y="157" font-size="26" letter-spacing="2" text-anchor="middle" fill="#e6edf3">RESPOND</text>
    <text class="hero-label" x="728" y="180" font-size="13" text-anchor="middle" fill="#8b949e">playbooks · canaries · gateway</text>
  </g>

  <!-- live route exit -->
  <line x1="832" y1="150" x2="860" y2="150" stroke="#cc0000" stroke-width="2"/>
  <circle class="pulse" cx="864" cy="150" r="12" fill="none" stroke="#cc0000" stroke-width="2" opacity="0.55"/>
  <circle cx="864" cy="150" r="5" fill="#ff3b30"/>

  <!-- extraction path to the package shelf -->
  <line x1="132" y1="196" x2="132" y2="236" stroke="#30363d" stroke-width="2" stroke-dasharray="4 5"/>
  <text class="hero-label" x="150" y="252" font-size="13" fill="#8b949e">extracted as MIT packages</text>
  <g fill="#0d1117" stroke="#2d7a3e" stroke-width="1.5">
    <rect x="480" y="238" width="16" height="16" rx="3"/>
    <rect x="504" y="238" width="16" height="16" rx="3"/>
    <rect x="528" y="238" width="16" height="16" rx="3"/>
    <rect x="552" y="238" width="16" height="16" rx="3"/>
    <rect x="576" y="238" width="16" height="16" rx="3"/>
    <rect x="600" y="238" width="16" height="16" rx="3"/>
    <rect x="624" y="238" width="16" height="16" rx="3"/>
    <rect x="648" y="238" width="16" height="16" rx="3"/>
  </g>
  <line x1="664" y1="246" x2="864" y2="246" stroke="#30363d" stroke-width="1" stroke-dasharray="2 6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Niffy Hunt systems workshop</title>
  <desc id="desc">A dark dimensional systems map showing hostile signals entering a workshop, becoming evidence, and leaving as open-source tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset="0.55" stop-color="#111722"/>
      <stop offset="1" stop-color="#1b0f13"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202a38"/>
      <stop offset="1" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff625d"/>
      <stop offset="1" stop-color="#b71925"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27b"/>
      <stop offset="1" stop-color="#c47b18"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93a4b8" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="21" fill="url(#grid)" stroke="#344154"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="42" y="48" font-size="14" letter-spacing="4" fill="#a9b5c5">NIFFY HUNT / SYSTEMS WORKSHOP</text>
    <circle cx="1084" cy="42" r="5" fill="#ff4f55" filter="url(#glow)"/>
    <text x="1100" y="48" text-anchor="end" font-size="13" fill="#d9e2ef">BUILT · RUN · OPEN</text>

    <text x="42" y="126" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="700" fill="#f3f6fb">Tools for difficult systems.</text>
    <text x="42" y="160" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" fill="#a9b5c5">Most of them find their way into security.</text>

    <!-- incoming signal -->
    <g opacity=".9">
      <path d="M44 260 C108 222 152 294 216 252 S318 234 372 270" fill="none" stroke="#ff625d" stroke-width="3" stroke-dasharray="8 11"/>
      <circle cx="52" cy="257" r="6" fill="#ff625d"/>
      <text x="44" y="300" font-size="12" letter-spacing="2" fill="#ff9a96">HOSTILE SIGNALS</text>
    </g>

    <!-- workshop block -->
    <g filter="url(#shadow)">
      <polygon points="398,190 632,142 824,190 590,238" fill="#2d394b" stroke="#51647d"/>
      <polygon points="398,190 590,238 590,362 398,310" fill="#15202c" stroke="#344154"/>
      <polygon points="590,238 824,190 824,314 590,362" fill="url(#surface)" stroke="#344154"/>
      <polygon points="480,193 612,167 722,193 590,220" fill="#0e141d" stroke="#63758b"/>
      <text x="590" y="205" text-anchor="middle" font-size="16" letter-spacing="3" fill="#f3f6fb">THE WORKSHOP</text>
      <text x="590" y="266" text-anchor="middle" font-size="12" letter-spacing="2" fill="#c1cad7">COLLECT  ·  SCORE  ·  SHIP</text>
      <path d="M448 267 L548 292 L548 326" fill="none" stroke="#d49745" stroke-width="3"/>
      <path d="M646 294 L770 262" fill="none" stroke="#ff625d" stroke-width="3"/>
      <circle cx="448" cy="267" r="6" fill="#ffd27b"/>
      <circle cx="548" cy="326" r="6" fill="#ffd27b"/>
      <circle cx="770" cy="262" r="6" fill="#ff625d"/>
      <text x="423" y="288" font-size="11" fill="#a9b5c5">evidence</text>
      <text x="680" y="312" font-size="11" fill="#a9b5c5">response</text>
    </g>

    <!-- outgoing tool nodes -->
    <g>
      <path d="M824 252 C870 220 882 192 916 160" fill="none" stroke="#ff625d" stroke-width="2" stroke-dasharray="5 8"/>
      <path d="M824 252 C894 252 922 252 966 252" fill="none" stroke="#77a8ff" stroke-width="2" stroke-dasharray="5 8"/>
      <path d="M824 252 C870 282 884 314 916 346" fill="none" stroke="#78d39b" stroke-width="2" stroke-dasharray="5 8"/>
      <g filter="url(#shadow)">
        <rect x="918" y="132" width="190" height="56" rx="12" fill="#171f2c" stroke="#744047"/>
        <rect x="918" y="224" width="190" height="56" rx="12" fill="#171f2c" stroke="#3d629a"/>
        <rect x="918" y="316" width="190" height="56" rx="12" fill="#171f2c" stroke="#38704d"/>
      </g>
      <text x="938" y="157" font-size="12" letter-spacing="2" fill="#ff9a96">WRAITHWALL</text>
      <text x="938" y="176" font-size="11" fill="#a9b5c5">deception → intelligence</text>
      <text x="938" y="249" font-size="12" letter-spacing="2" fill="#9bc3ff">RESTVERIFY</text>
      <text x="938" y="268" font-size="11" fill="#a9b5c5">restore → proof</text>
      <text x="938" y="341" font-size="12" letter-spacing="2" fill="#9ce6b4">OPEN SOURCE</text>
      <text x="938" y="360" font-size="11" fill="#a9b5c5">tools that stand alone</text>
    </g>

    <text x="44" y="378" font-size="12" letter-spacing="2" fill="#76869a">SECURITY · INFRASTRUCTURE · AUTOMATION · OPEN SOURCE</text>
  </g>
</svg>
